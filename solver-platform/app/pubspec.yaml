name: solver_app
description: "Solver Platform - Educational Engine Solver"
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  google_sign_in: ^6.2.2
  dio: ^5.7.0
  dio_cookie_manager: ^3.5.0
  cookie_jar: ^4.0.8
  flutter_foreground_task: ^8.11.0
  flutter_secure_storage: ^9.2.4
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  cached_network_image: ^3.4.1
  intl: ^0.19.0
  encrypt: ^5.0.3
  uuid: ^4.5.1
  image_picker: ^1.1.2
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/answers.enc
    - assets/branding/logo.png
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800
